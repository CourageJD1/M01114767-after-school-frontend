<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>After-School Lessons</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="lessons.js"></script>
</head>
<body>

    <div id="app">

        <header>
            <h1><i class="fa fa-graduation-cap" aria-hidden="true"></i> {{ sitename }}</h1>

            <!-- Disabled while the cart is empty, but never while the cart page is open,
                 so the user can always get back to the lessons -->
            <button class="cart-button" v-on:click="toggleCart" v-bind:disabled="cart.length === 0 && !showCart">
                <span v-if="showCart"><i class="fa fa-arrow-left" aria-hidden="true"></i> Back to lessons</span>
                <span v-else><i class="fa fa-shopping-cart" aria-hidden="true"></i> Cart ({{ cartItemCount }})</span>
            </button>
        </header>

        <!-- Lessons page -->
        <main v-if="!showCart">

            <!-- One card per lesson -->
            <div class="lesson-list">
                <div class="lesson" v-for="lesson in lessons" v-bind:key="lesson._id">
                    <img v-bind:src="imageUrl(lesson)" v-bind:alt="lesson.topic">
                    <div class="lesson-details">
                        <p class="subject"><strong>Subject:</strong> {{ lesson.topic }}</p>
                        <p><strong>Location:</strong> {{ lesson.location }}</p>
                        <p><strong>Price:</strong> £{{ lesson.price }}</p>
                        <p><strong>Spaces:</strong> {{ lesson.space }}</p>

                        <!-- v-bind:disabled keeps the button visible at 0 spaces; v-if would hide it -->
                        <button v-on:click="addToCart(lesson)" v-bind:disabled="!canAddToCart(lesson)">
                            <i class="fa fa-cart-plus" aria-hidden="true"></i> Add to Cart
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Cart page -->
        <main v-else>
            <h2>Shopping Cart</h2>
            <p>{{ cartItemCount }} space(s) in your cart.</p>
        </main>

    </div>

    <script type="module">
        const { createApp } = Vue;

        const lessonApp = createApp({
            data() {
                return {
                    sitename: "After-School Lessons",
                    lessons: lessonsArray,      // the array in lessons.js
                    cart: [],                   // lesson _id values, one entry per space
                    showCart: false,            // false = lessons page, true = cart page
                };
            },

            computed: {
                cartItemCount() {
                    return this.cart.length;
                },
            },

            methods: {
                imageUrl(lesson) {
                    return "images/" + lesson.image;
                },

                // One click puts one space in the cart and takes one from the lesson
                addToCart(lesson) {
                    if (lesson.space > 0) {
                        this.cart.push(lesson._id);
                        lesson.space--;
                    }
                },

                canAddToCart(lesson) {
                    return lesson.space > 0;
                },

                toggleCart() {
                    this.showCart = !this.showCart;
                },
            },
        });

        lessonApp.mount("#app");
    </script>

</body>
</html>
